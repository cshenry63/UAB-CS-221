<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A responsive gallery of beautiful places in nature.">
    <title>Nature Through My Lens | Photo Gallery</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="site-header">
        <h1>Nature Through My Lens</h1>
        <p>A collection of beautiful places around the world</p>
    </header>

    <main class="gallery" aria-label="Nature photo gallery">
        <div class="gallery-item photo-one" data-caption="Mountains at sunrise" role="img" aria-label="Mountains at sunrise"></div>
        <div class="gallery-item photo-two" data-caption="Peaceful forest" role="img" aria-label="Peaceful forest"></div>
        <div class="gallery-item photo-three" data-caption="Ocean waves" role="img" aria-label="Ocean waves"></div>
        <div class="gallery-item photo-four" data-caption="Desert landscape" role="img" aria-label="Desert landscape"></div>
        <div class="gallery-item photo-five" data-caption="Waterfall in the wilderness" role="img" aria-label="Waterfall in the wilderness"></div>
        <div class="gallery-item photo-six featured" data-caption="A quiet lake" role="img" aria-label="A quiet lake"></div>
    </main>

    <footer>
        <p>Nature Photo Gallery | Images from Unsplash</p>
    </footer>
</body>
</html>
