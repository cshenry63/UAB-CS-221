<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A responsive gallery of home.">
    <title>Home | Photo Gallery</title>
    <link rel="stylesheet" href="hw8.cshenry.css">
</head>
<body>
    <header class="site-header">
        <h1>Home</h1>
        <p>Home Asthetic Photos</p>
    </header>

    <main class="gallery" aria-label="Home asthetic photo gallery">
        <div class="gallery-item photo-one" data-caption="Kitchen Inspo" role="img" aria-label="Kitchen Inspo"></div>
        <div class="gallery-item photo-two" data-caption="Living Room Inspo" role="img" aria-label="Living Room Inspo"></div>
        <div class="gallery-item photo-three" data-caption="Decor Inspo" role="img" aria-label="Decor Inspo"></div>
        <div class="gallery-item photo-four" data-caption="Bedroom Inspo" role="img" aria-label="Bedroom Inspo"></div>
        <div class="gallery-item photo-five" data-caption="Outdoors" role="img" aria-label="Outdoors"></div>
        <div class="gallery-item photo-six featured" data-caption="Cabin in the Woods" role="img" aria-label="Cabin in the Woods"></div>
    </main>

    <footer>
        <p>Home Photo Gallery | Images from Unsplash</p>
    </footer>
</body>
</html>
