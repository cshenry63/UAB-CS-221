<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book Finder</title>
  <link rel="stylesheet" href="cshenry.lab9.css">
  <script src="cshenry.lab9.js" defer></script>
</head>
<body>
  <main class="container">
    <section class="search-panel" aria-labelledby="page-title">
      <h1 id="page-title">Book Finder</h1>

      <form id="search-form" novalidate>
        <label for="query">Search by title or author</label>
        <div class="search-row">
          <input id="query" type="search" maxlength="200" required>
          <button type="submit">Search</button>
        </div>
      </form>

      <p id="search-status" role="status"></p>
    </section>

    <div class="collection">
      <section class="panel" aria-labelledby="results-title">
        <h2 id="results-title">Search results</h2>
        <ul id="results" class="books"></ul>
      </section>

      <section class="panel" aria-labelledby="shelf-title">
        <h2 id="shelf-title">My bookshelf</h2>
        <p id="shelf-status" role="status"></p>
        <ul id="shelf" class="books"></ul>
      </section>
    </div>

    <template id="book-card">
      <li class="book">
        <h3></h3>
        <p class="author"></p>

        <details>
          <summary>Book details</summary>
          <dl>
            <dt>First published</dt>
            <dd class="year"></dd>
            <dt>Cataloged editions</dt>
            <dd class="editions"></dd>
          </dl>
        </details>

        <button class="book-action" type="button"></button>
      </li>
    </template>
  </main>
</body>
</html>
