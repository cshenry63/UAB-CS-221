
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Even or Odd Checker</title>
    <style>
        body {
            background-color: lightgreen;
        }
    </style>
    <script>
        // Asks the user to enter a number
        let input = prompt("Enter a number:");

        // Converting the input from a string to a number
        let number = Number(input);

        // Check if the user entered an invalid number or canceled.
        if (input === null || input.trim() === "" || isNaN(number) || !Number.isInteger(number)) {
            console.log("Invalid input. Please enter a whole number.");
        }
        // Use modulus to check if the number divides evenly by 2.
        else if (number % 2 === 0) {
            console.log(number + " is an even number.");
        }
        // If the number is not even, it must be odd.
        else {
            console.log(number + " is an odd number.");
        }
    </script>
</head>
<body>
    <h1>Even or Odd Number Checker</h1>
    <p>Open the browser console to see your result.</p>
</body>
</html>
